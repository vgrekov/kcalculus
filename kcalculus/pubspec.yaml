name: kcalculus
description: "A cross-platform app that helps you to keep an eye on calorie intake."
publish_to: 'none'
version: 0.2.0+25

environment:
  sdk: ^3.5.3

dependencies:
  crypto: ^3.0.6
  file_picker: ^10.1.9
  firebase_analytics: ^11.4.4
  firebase_core: ^3.10.1
  firebase_crashlytics: ^4.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_riverpod: ^2.5.3
  freezed_annotation: ^3.0.0
  google_fonts: ^6.2.1
  google_mobile_ads: ^6.0.0
  http: ^1.3.0
  intl: any
  json_annotation: ^4.9.0
  logging: ^1.3.0
  mobile_scanner: ^7.0.1
  package_info_plus: ^8.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.5
  sqflite: ^2.4.0
  uuid: ^4.5.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/db/
    - assets/db/migrations/
    - assets/agreements/
    - assets/images/
    - assets/usda/dumps/
    - assets/usda/db/migrations/
