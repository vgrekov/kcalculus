name: kcalculus
description: "A cross-platform app that helps you to keep an eye on calorie intake."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.3
  google_fonts: ^6.2.1
  intl: any
  path: ^1.9.0
  sqflite: ^2.4.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/db/migrations/