name: kcalculus
description: "A cross-platform app that helps you to keep an eye on calorie intake."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.5.3

dependencies:
  file_picker: ^8.3.5
  firebase_analytics: ^11.4.4
  firebase_core: ^3.10.1
  firebase_crashlytics: ^4.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_riverpod: ^2.5.3
  freezed_annotation: ^2.4.4
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.3.1
  http: ^1.3.0
  intl: any
  json_annotation: ^4.9.0
  logging: ^1.3.0
  mobile_scanner: ^6.0.6
  package_info_plus: ^8.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  sqflite: ^2.4.0
  uuid: ^4.5.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/db/
    - assets/db/migrations/
    - assets/agreements/