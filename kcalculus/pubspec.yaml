name: kcalculus
description: "A cross-platform app that helps you to keep an eye on calorie intake."
publish_to: 'none'
version: 1.0.5+50

environment:
  sdk: ^3.12.1

dependencies:
  algoliasearch: ^1.49.2
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.3.2
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  file_picker: ^10.3.10
  firebase_analytics: ^12.4.2
  firebase_app_check: ^0.4.4+2
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_database: ^12.4.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  purchases_flutter: ^10.4.2
  purchases_ui_flutter: ^10.6.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  source_gen: ^4.2.3
  mustache_template: ^2.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/db/
    - assets/db/migrations/
    - assets/agreements/
    - assets/images/
    - assets/usda/dumps/
    - assets/usda/db/migrations/
